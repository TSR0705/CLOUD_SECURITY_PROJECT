services:
  postgres:
    image: postgres:18-alpine
    container_name: sug-postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: sug
      POSTGRES_USER: sug_admin
      POSTGRES_PASSWORD: sug_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - data
      - scan
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sug_admin -d sug']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  localstack:
    image: localstack/localstack:3.8.1
    container_name: sug-localstack
    restart: unless-stopped
    ports:
      - '127.0.0.1:4566:4566'
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      DEFAULT_REGION: us-east-1
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    volumes:
      - localstack_data:/var/lib/localstack
      - ./init/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    networks:
      - store
      - scan
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:4566/_localstack/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  fake-gcs-server:
    image: fsouza/fake-gcs-server:1.56.1
    container_name: sug-fake-gcs
    restart: unless-stopped
    ports:
      - '127.0.0.1:4443:4443'
    command:
      - '-scheme'
      - 'http'
      - '-port'
      - '4443'
      - '-external-url'
      - 'http://localhost:4443'
      - '-public-host'
      - 'localhost:4443'
      - '-data'
      - '/data'
      - '-backend'
      - 'filesystem'
      - '-filesystem-root'
      - '/storage'
    volumes:
      - fake_gcs_data:/storage
      - ./init/data:/data:ro
    networks:
      - store
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:4443/storage/v1/b']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  clamav:
    image: clamav/clamav:1.4.6
    container_name: sug-clamav
    restart: unless-stopped
    ports:
      - '127.0.0.1:${CLAMAV_PORT:-3310}:3310'
    environment:
      CLAMD_CONF_StreamMaxLength: 55M
      CLAMD_CONF_MaxFileSize: 55M
      CLAMD_CONF_MaxScanSize: 200M
      CLAMD_CONF_MaxRecursion: '10'
      CLAMD_CONF_MaxFiles: '2000'
      CLAMD_CONF_MaxScanTime: '60000'
      CLAMD_CONF_AlertExceedsMax: 'yes'
      CLAMD_CONF_AlertEncrypted: 'yes'
      CLAMD_CONF_AlertEncryptedArchive: 'yes'
      CLAMD_CONF_MaxThreads: '4'
      CLAMD_CONF_ConcurrentDatabaseReload: 'no'
      CLAMAV_NO_FRESHCLAMD: 'true'
      FRESHCLAM_CHECKS: '0'
    deploy:
      resources:
        limits:
          memory: 4096M
    networks:
      - scan
      - data
    healthcheck:
      test: ['CMD-SHELL', 'clamdcheck.sh']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  scanner:
    build:
      context: ../../
      dockerfile: services/scanner/Dockerfile
    container_name: sug-scanner
    restart: unless-stopped
    read_only: true
    user: '1000:1000'
    cap_drop:
      - ALL
    security_opt:
      - 'no-new-privileges:true'
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128M
    networks:
      - scan
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      clamav:
        condition: service_healthy
    secrets:
      - source: aws_secret_access_key_scanner
        mode: 0444
      - source: db_password
        mode: 0444
    environment:
      NODE_ENV: production
      SERVICE_NAME: sug-scanner
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: sug_scanner
      POSTGRES_PASSWORD: sug_scanner_dev_password
      POSTGRES_DB: sug
      S3_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID_SCANNER: sug-scanner-key
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:3001/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

networks:
  edge:
    name: sug-edge
    driver: bridge
  data:
    name: sug-data
    driver: bridge
  store:
    name: sug-store
    driver: bridge
  scan:
    name: sug-scan
    driver: bridge
    internal: true
  egress:
    name: sug-egress
    driver: bridge

volumes:
  postgres_data:
    name: sug_postgres_data
  localstack_data:
    name: sug_localstack_data
  fake_gcs_data:
    name: sug_fake_gcs_data

secrets:
  pepper:
    file: ../../secrets/pepper
  kek:
    file: ../../secrets/kek
  jwt_private_key:
    file: ../../secrets/jwt_private_key.pem
  checkpoint_private_key:
    file: ../../secrets/checkpoint_private_key.pem
  db_password:
    file: ../../secrets/db_password
  aws_secret_access_key:
    file: ../../secrets/aws_secret_access_key
  aws_secret_access_key_api:
    file: ../../secrets/aws_secret_access_key_api
  aws_secret_access_key_scanner:
    file: ../../secrets/aws_secret_access_key_scanner
  aws_secret_access_key_promoter:
    file: ../../secrets/aws_secret_access_key_promoter
  aws_secret_access_key_replicator:
    file: ../../secrets/aws_secret_access_key_replicator
