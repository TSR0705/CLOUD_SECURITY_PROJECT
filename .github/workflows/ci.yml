name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build, Lint, Typecheck, Test, and Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack & Install Pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.5.1 --activate

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Check code formatting (Prettier)
        run: pnpm format:check

      - name: Run linter & boundary checks (ESLint 10)
        run: pnpm lint

      - name: Run strict typechecking (TypeScript 6.0.3)
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build

      - name: Validate OpenAPI specification
        run: pnpm openapi:check

      - name: Generate local development secrets
        run: bash scripts/gen-secrets.sh

      - name: Start infrastructure services (Docker Compose)
        run: |
          docker compose -f infrastructure/docker/docker-compose.yml up -d --wait

      - name: Run database migrations
        env:
          POSTGRES_PORT: 5432
          POSTGRES_HOST: 127.0.0.1
        run: pnpm db:migrate

      - name: Run test suite (Vitest 5)
        env:
          POSTGRES_PORT: 5432
          POSTGRES_HOST: 127.0.0.1
        run: pnpm test

      - name: Stop infrastructure services
        if: always()
        run: docker compose -f infrastructure/docker/docker-compose.yml down

      - name: Secret Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
